name: Build Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Bump version (before build, so the AAB gets the new version) ──
      - name: Bump version
        run: bash scripts/bump-version.sh

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-bump version [skip ci]"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sL "$CMDTOOLS_URL" -o /tmp/cmd.zip
          unzip -qo /tmp/cmd.zip -d /tmp/cmd
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/cmd/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "y" | sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - run: npm ci --legacy-peer-deps

      - name: Create .env.production
        run: |
          cat > .env.production <<- EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_ADMOB_APP_ID=${{ secrets.NEXT_PUBLIC_ADMOB_APP_ID }}
          NEXT_PUBLIC_ADMOB_NATIVE_ID=${{ secrets.NEXT_PUBLIC_ADMOB_NATIVE_ID }}
          EOF

      - name: Validate AdMob secrets
        run: |
          missing=0
          for name in NEXT_PUBLIC_ADMOB_APP_ID NEXT_PUBLIC_ADMOB_NATIVE_ID; do
            if [ -z "${!name}" ]; then
              echo "[ERR] Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create both AdMob secrets before running the Android release build."
            exit 1
          fi
        env:
          NEXT_PUBLIC_ADMOB_APP_ID: ${{ secrets.NEXT_PUBLIC_ADMOB_APP_ID }}
          NEXT_PUBLIC_ADMOB_NATIVE_ID: ${{ secrets.NEXT_PUBLIC_ADMOB_NATIVE_ID }}

      - name: Init Capacitor Android project
        run: |
          rm -rf android
          set -a
          source .env.production
          set +a
          echo "[DEBUG] NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID:0:20}..."
          echo "[DEBUG] NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-unset}"
          npx cap add android

      - name: Write google-services.json from secret
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Add deep link intent filters (OAuth + App Links + Custom Scheme)
        run: bash scripts/add-deep-link.sh
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Patch MainActivity for Google auth intent forwarding
        run: bash scripts/patch-main-activity.sh

      - name: Install Native AdMob plugin
        run: bash scripts/install-native-ad.sh

      - name: Install ImageMagick (icon generation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate app icons
        run: bash scripts/generate-icons.sh

      - name: Reconstruct keystore from secret
        run: echo "$KEYSTORE" | base64 -d > chessduo.keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<- EOF
          storeFile=../../chessduo.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Validate assetlinks.json fingerprint
        run: |
          ACTUAL=$(python3 -c "import json;print(json.load(open('public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0])")
          EXPECTED="${{ secrets.ASSETLINKS_SHA256 }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Fingerprint mismatch: expected $EXPECTED, got $ACTUAL"
            echo "Update public/.well-known/assetlinks.json to the Play App Signing key SHA256 (Play Console → Release → Setup → App signing)."
            exit 1
          fi
          echo "assetlinks.json fingerprint verified: $ACTUAL"

      # ── Push the bump commit after all setup but before build ──
      # This ensures the git repo is updated before the lengthy build,
      # and [skip ci] prevents recursive triggering.
      - name: Push version bump
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Build AAB
        run: bash scripts/build-aab.sh
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ secrets.EXPECTED_KEYSTORE_SHA1 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChessDuo-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build APK
        run: bash scripts/build-apk.sh
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ secrets.EXPECTED_KEYSTORE_SHA1 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChessDuo-APK
          path: android/app/build/outputs/apk/release/app-release.apk
