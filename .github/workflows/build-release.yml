name: Build Release

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sL "$CMDTOOLS_URL" -o /tmp/cmd.zip
          unzip -qo /tmp/cmd.zip -d /tmp/cmd
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/cmd/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "y" | sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: Create .env.production
        run: |
          cat > .env.production <<- EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STOCKFISH_SERVER_URL=${{ secrets.NEXT_PUBLIC_STOCKFISH_SERVER_URL }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EOF

      - name: Init Capacitor Android project
        run: |
          rm -rf android
          set -a
          source .env.production
          set +a
          echo "[DEBUG] NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID:0:20}..."
          echo "[DEBUG] NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_ANDROID_CLIENT_ID:0:20}..."
          npx cap add android

      - name: Add OAuth deep link intent filter
        run: bash scripts/add-deep-link.sh

      - name: Patch MainActivity for Google auth intent forwarding
        run: bash scripts/patch-main-activity.sh

      - name: Patch GoogleProvider to skip getAuthorizationResult in online mode
        run: bash scripts/patch-google-provider.sh

      - name: Copy custom app icons
        run: bash scripts/copy-app-icons.sh

      - name: Reconstruct keystore from secret
        run: echo "$KEYSTORE" | base64 -d > chessduo.keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<- EOF
          storeFile=../../chessduo.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build AAB
        run: bash scripts/build-aab.sh
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ secrets.EXPECTED_KEYSTORE_SHA1 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChessDuo-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Build APK
        run: bash scripts/build-apk.sh
        env:
          EXPECTED_KEYSTORE_SHA1: ${{ secrets.EXPECTED_KEYSTORE_SHA1 }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChessDuo-APK
          path: android/app/build/outputs/apk/release/app-release.apk
