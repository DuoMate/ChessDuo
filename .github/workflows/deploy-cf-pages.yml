name: Deploy to Cloudflare Workers

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Stamp web build version
        run: |
          source android-version.properties
          echo "NEXT_PUBLIC_APP_VERSION=${versionName}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_VERSION_CODE=${versionCode}" >> "$GITHUB_ENV"
      # ── Regenerate public/version.json from android-version.properties ──
      # The version bump lives in build-release.yml, whose "chore: auto-bump
      # version [skip ci]" commits never trigger this workflow — so a
      # hand-committed version.json could go stale and the in-app update
      # prompt would silently never fire (users on ≥ the last deployed
      # version always compare as "current"). Deriving the hosted manifest
      # from the release source of truth at deploy time keeps it in lockstep
      # with the actual Play release regardless of commit ordering.
      - name: Regenerate version manifest from release source of truth
        run: |
          source android-version.properties
          cat > public/version.json <<- EOF
          {
            "latestVersion": "${versionName}",
            "latestVersionCode": ${versionCode},
            "minimumVersion": "1.0.300",
            "minimumVersionCode": 300,
            "playUrl": "https://play.google.com/store/apps/details?id=com.navron.chessduo",
            "notes": "Regenerated at deploy time from android-version.properties — do not edit by hand."
          }
          EOF
          echo "[INFO] version.json regenerated: ${versionName} (${versionCode})"
      - run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_SLOT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ID }}
          NEXT_PUBLIC_APP_VERSION: ${{ env.NEXT_PUBLIC_APP_VERSION }}
          NEXT_PUBLIC_VERSION_CODE: ${{ env.NEXT_PUBLIC_VERSION_CODE }}
      - name: Validate Google Play verification secrets
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
        run: |
          missing=0
          for name in GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GOOGLE_PLAY_PACKAGE_NAME; do
            if [ -z "${!name}" ]; then
              echo "[ERR] Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the Google Play verification secrets before deploying the production API."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_VAPID_PUBLIC_KEY
            NEXT_PUBLIC_ADSENSE_CLIENT_ID
            NEXT_PUBLIC_ADSENSE_SLOT_ID
            FCM_SERVICE_ACCOUNT_JSON
            FCM_PROJECT_ID
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
            SUPABASE_SERVICE_ROLE_KEY
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            GOOGLE_PLAY_PACKAGE_NAME
          command: deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_SLOT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ secrets.GOOGLE_PLAY_PACKAGE_NAME }}
