# Render configuration for ChessDuo Frontend (Next.js)
services:
  - type: web
    name: chessduo-fe
    env: node
    rootDirectory: /
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/healthz
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_STOCKFISH_SERVER_URL
        sync: false